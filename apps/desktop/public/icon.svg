<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- Recall app icon: the mark (focus pull, mono glow) on a black tile.
       Source of truth: prototypes/logo/final. Rasterized by build/render-icons.py. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151517"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <radialGradient id="moment" cx="40%" cy="36%" r="72%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".62" stop-color="#F2F2F4"/>
      <stop offset="1" stop-color="#C9C9D0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="b0" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="b1" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.1"/></filter>
  </defs>
  <rect width="100" height="100" rx="23" fill="url(#tile)"/>
  <rect x=".5" y=".5" width="99" height="99" rx="22.5" fill="none" stroke="#fff" stroke-opacity=".1"/>
  <g transform="translate(18 18) scale(.64)">
    <circle cx="65" cy="35" r="16.25" fill="#FFFFFF" opacity=".55" filter="url(#glow)"/>
    <path d="M43 84.2H30A14.2 14.2 0 0 1 15.8 70V57" stroke="#FFFFFF" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M52 13.8H65A21.2 21.2 0 0 1 86.2 35V48" stroke="#FFFFFF" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30" cy="70" r="5.5" fill="#FFFFFF" opacity=".34" filter="url(#b0)"/>
    <circle cx="47.5" cy="52.5" r="8" fill="#FFFFFF" opacity=".55" filter="url(#b1)"/>
    <circle cx="65" cy="35" r="12.5" fill="url(#moment)"/>
  </g>
</svg>
